app:
  language: vi
  prototype_notice: "Mẫu thử hỗ trợ quan sát; không dùng khi lái xe thực tế."

vision:
  model_path: "models/face_landmarker.task"
  num_faces: 2
  min_face_fraction: 0.08
  max_reprojection_error_px: 12.0

thresholds:
  ear_closed: 0.21
  ear_open: 0.24
  yaw_distracted_deg: 30.0
  yaw_return_hysteresis_deg: 5.0
  closed_hold_s: 1.2
  distracted_hold_s: 1.0
  max_gap_s: 0.75
  ema_tau_s: 0.15

display:
  mirror: true
  width: 640
  height: 480
